version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mymagti-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mymagti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: mymagti-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mymagti_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: =======================MyMagtiSimulatorSecretKey=========================
    ports:
      - "8080:8080"

volumes:
  postgres_data:
